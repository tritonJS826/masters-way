info:
  contact: {}
  title: Masters way general API
  version: "1.0"
paths:
  /auth/{provider}:
    get:
      consumes:
      - application/json
      operationId: begin-auth
      parameters:
      - description: google
        in: path
        name: provider
        required: true
        type: string
      - description: telegram auth code for linking
        in: query
        name: telegramCode
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Temporary Redirect
      summary: Begin oauth
      tags:
      - auth
  /auth/{provider}/callback:
    get:
      consumes:
      - application/json
      operationId: google auth log in callback function
      parameters:
      - description: code param
        in: query
        name: code
        required: true
        type: string
      - description: state parameter
        in: query
        name: state
        required: true
        type: string
      - description: google
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Redirect to frontend with JWT token
          schema:
            $ref: '#/definitions/schemas.GetAuthCallbackFunctionResponse'
      summary: Log in with google oAuth
      tags:
      - auth
  /auth/current:
    get:
      consumes:
      - application/json
      operationId: get-current-authorized-user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.CurrentUserResponse'
      summary: Get current authorized user
      tags:
      - auth
  /auth/google-token:
    get:
      consumes:
      - application/json
      description: This endpoint retrieves the Google access token for an authenticated
        user.
      operationId: get-google-token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.GoogleToken'
      summary: Retrieve Google Access Token
      tags:
      - auth
  /auth/login/local/{userEmail}:
    get:
      consumes:
      - application/json
      description: Login locally by providing an email address.
      operationId: get token locally
      parameters:
      - description: email
        in: path
        name: userEmail
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.GetAuthCallbackFunctionResponse'
      summary: login locally by email (with no oauth)
      tags:
      - auth
  /auth/logout/{provider}:
    get:
      consumes:
      - application/json
      operationId: logout-current-authorized-user
      parameters:
      - description: google
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Logout current authorized user
      tags:
      - auth
  /auth/refreshToken:
    post:
      consumes:
      - application/json
      operationId: refresh-access-token
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.RefreshAccessTokenPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.RefreshAccessTokenResponse'
      summary: Retrieve Access Token
      tags:
      - auth
  /auth/telegram/initiate:
    post:
      consumes:
      - application/json
      description: Creates a pending Telegram linking record and returns Google Auth
        URL with code
      operationId: initiate-telegram-login
      parameters:
      - description: Telegram login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.InitiateTelegramLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.InitiateTelegramLoginResponse'
      summary: Initiate Telegram login
      tags:
      - auth
  /auth/telegram/link:
    post:
      consumes:
      - application/json
      description: Links a Telegram account to the user using an auth code
      operationId: link-telegram
      parameters:
      - description: Telegram linking request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LinkTelegramRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Link Telegram account
      tags:
      - auth
  /auth/telegram/test-link:
    get:
      consumes:
      - application/json
      description: Creates a user by email and links it to the Telegram user by auth
        code
      operationId: test-telegram-link
